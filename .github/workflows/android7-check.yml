name: Android 7 check

# Manual or on pull requests only. Does not publish anything.
on:
  workflow_dispatch:
  pull_request:

jobs:
  api24:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Empty local.properties
        run: touch local.properties

      - name: Lint (reports calls to newer Android APIs)
        continue-on-error: true
        run: gradle lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Run on Android 7.0 (API 24) emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android7-smoke.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android7-results
          path: android7-results/
          if-no-files-found: ignore
