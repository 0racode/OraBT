name: Collect MySchool questions
# Written permission from MySchool: free educational app, credit + link to myschool.ng, remove on request.
# Slow on purpose: one request every few seconds, honest User-Agent, stops after max_minutes.
on:
  workflow_dispatch:
    inputs:
      subjects:
        description: "Subject slugs, space separated (e.g. biology chemistry)"
        required: true
      exam_types:
        description: "jamb, waec, neco (space separated)"
        required: true
        default: "jamb"
      years:
        description: "Years, space separated"
        required: true
      max_minutes:
        description: "Stop after this many minutes"
        required: true
        default: "20"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4
      - name: Collect
        env:
          SUBJECTS: ${{ github.event.inputs.subjects }}
          EXAM_TYPES: ${{ github.event.inputs.exam_types }}
          YEARS: ${{ github.event.inputs.years }}
          MAX_MINUTES: ${{ github.event.inputs.max_minutes }}
        run: python tools/collect_myschool.py
      - name: Save results on the data branch
        if: always()
        run: |
          set -e
          cp out/myschool.jsonl /tmp/result.jsonl
          git config user.name "collector"; git config user.email "collector@users.noreply.github.com"
          git fetch origin collected || true
          if git rev-parse --verify origin/collected >/dev/null 2>&1; then git checkout -B collected origin/collected; else git checkout --orphan collected; git rm -rf . >/dev/null 2>&1 || true; fi
          mkdir -p myschool
          cp /tmp/result.jsonl "myschool/run-${{ github.run_id }}.jsonl"
          git add myschool
          git commit -m "MySchool collection run ${{ github.run_id }}"
          git push origin collected
